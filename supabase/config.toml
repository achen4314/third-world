# 第三世界 · Supabase CLI 本地配置（占位值，不含任何密钥）
# 用途：让 `supabase link` / `db push` / `db reset` 在本地跑通
# 说明：不同 CLI 版本对字段的容忍度不同，出现 unknown-field 警告可忽略或按提示删行。

project_id = "bffuuxdnztowlwbxjlzp"   # 已在 Dashboard 确认；CLI link 用 --project-ref 同名
# 区域：us-east-1（美国东部·北弗吉尼亚）。上线前需迁境内，见 README §0

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

# ── Edge Functions ───────────────────────────────────────────────────────────
# verify_jwt = true  ：Supabase 网关先校验 JWT，函数内再取用户身份走 RLS
# verify_jwt = false ：厂商浏览器跳回来，压根没有 JWT，安全性靠 state 的 HMAC 签名
[functions.export-athlete-data]
verify_jwt = true

[functions.delete-athlete-data]
verify_jwt = true

[functions.device-oauth-start]
verify_jwt = true

[functions.oauth-callback]
verify_jwt = false
