# 第三世界 · Supabase CLI 本地配置（占位值，不含任何密钥）
# 用途：让 `supabase link` / `db push` / `db reset` 在本地跑通
# 说明：不同 CLI 版本对字段的容忍度不同，出现 unknown-field 警告可忽略或按提示删行。

project_id = "third-world"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"
