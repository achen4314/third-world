# 第三世界 · 站点配置（增量挂载，不改现有 Dify 的 server 块）
#
# 放到 /etc/nginx/conf.d/arc-training.conf，然后 nginx -t && systemctl reload nginx。
# 关键：这台服务器 80 端口上已经跑着 Dify（Next.js，/signin）。
# 本配置用独立 server_name 按 Host 分流，不设 default_server、不占用 Dify 的路径，
# 因此 Dify 的原有访问完全不受影响。若域名没解析到本机，本块永远不会被命中。
#
# 上线前把 app.trthirdworld.online 换成实际域名（或改成 $ARC_DOMAIN 渲染后的值）。

server {
    listen 80;
    listen [::]:80;
    server_name app.trthirdworld.online;

    # 前端是零构建静态站，直接发文件；所有数据由浏览器走 Supabase PostgREST / GoTrue
    root /opt/arc-training/prototype;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|svg|png|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    # env.js 里是 publishable key（本来就可公开），但禁止缓存，改配置后不用刷 CDN
    location = /env.js { add_header Cache-Control "no-store" always; }

    # 后台管理控制台：入口 /admin/ ，接口 /api/ 。两者都在 127.0.0.1:8787，
    # 由 admin-console.mjs 做 Bearer token 校验；nginx 不额外开公网端口。
    location = /admin { return 301 /admin/; }
    location /admin/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/arc-training.access.log;
    error_log  /var/log/nginx/arc-training.error.log warn;
}

# ── 备案 + 证书完成后，把上面 listen 80 的块换成 certbot 托管，或追加：
# listen 443 ssl http2;
# ssl_certificate     /etc/letsencrypt/live/app.trthirdworld.online/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/app.trthirdworld.online/privkey.pem;
